<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ahmed &amp; Christine RSVP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="page-shell">
      <section class="invite-stage" aria-label="Engagement invitation">
        <!--
          ENVELOPE STRUCTURE (mirrors the Webflow template's Navigator tree):

            .envelope                       scene / 3D perspective context
            ├── .envelope__back             bottom layer: envelope back + pocket
            │   └── img  envelope-back
            ├── .envelope__card-wrapper     the invitation card; slides up & rotates
            │   └── img  invitation card
            ├── .envelope__flap-shadow      soft shadow cast by the opening flap
            │   └── img  flap-shadow
            ├── .envelope__flap             the flap; hinges open on a 3D rotateX
            │   ├── img .flap-face          outer face of the flap (sealed view)
            │   └── img .flap-inside        inner face (revealed as it opens)
            └── .envelope__front            front pocket panel; masks card's lower half
                └── img  envelope-front

          IMAGE FILES YOU NEED TO ADD (drop into project root, match these names):
            envelope-back.webp   - envelope back panel + pocket, no flap
            envelope-flap.webp   - the triangular flap only, transparent elsewhere
            flap-inside.webp     - inner face of the flap (gold lining etc.)
            flap-shadow.webp     - soft triangular shadow (semi-transparent)
            envelope-front.webp  - front pocket panel (transparent where card shows)
            invitation_7pm.png   - the invitation card (you already have this)

          All envelope images should share the SAME canvas dimensions so the
          layers register exactly when stacked. Set --env-aspect below to match.
        -->
        <div class="envelope preload" id="envelope" data-state="closed">
          <div class="envelope__glow" aria-hidden="true"></div>

          <!-- Bottom layer: envelope back + pocket -->
          <img
            src="envelope-back.webp"
            alt=""
            class="envelope__back"
            aria-hidden="true"
            draggable="false"
          />

          <!-- The invitation card -->
          <div class="envelope__card-wrapper" aria-hidden="true">
            <img
              src="invitation_7pm.png"
              alt="The engagement invitation for Ahmed and Christine"
              class="envelope__card"
              draggable="false"
            />
          </div>

          <!-- Soft shadow the flap casts as it opens -->
          <img
            src="flap-shadow.webp"
            alt=""
            class="envelope__flap-shadow"
            aria-hidden="true"
            draggable="false"
          />

          <!-- The flap: a 3D-hinged element with an outer and inner face -->
          <div class="envelope__flap" aria-hidden="true">
            <img src="envelope-flap.webp" alt="" class="flap-face" draggable="false" />
            <img src="flap-inside.webp" alt="" class="flap-inside" draggable="false" />
          </div>

          <!-- Front pocket panel: sits on top, masks the card's lower half -->
          <img
            src="envelope-front.webp"
            alt=""
            class="envelope__front"
            aria-hidden="true"
            draggable="false"
          />

          <!-- Invisible click target -->
          <button
            class="envelope__trigger"
            id="openInvite"
            type="button"
            aria-label="Open invitation"
          >
            <span class="trigger-hint">tap to open</span>
          </button>
        </div>

        <div class="scroll-cue" id="scrollCue" aria-hidden="true">
          RSVP below ↓
        </div>
      </section>

      <section class="rsvp-section" id="rsvp">
        <div class="rsvp-art">
          <div class="reply-by">Reply by July 15</div>

          <h2>RSVP</h2>

          <div class="divider">
            <span></span>
            <b>♥</b>
            <span></span>
          </div>

          <form id="rsvpForm">
            <label>
              <span>Your name</span>
              <input
                name="name"
                autocomplete="name"
                placeholder="First and last name"
                required
              />
            </label>

            <label>
              <span>Email</span>
              <input
                name="email"
                type="email"
                autocomplete="email"
                placeholder="So we can stay in touch"
                required
              />
            </label>

            <fieldset>
              <legend>Will you be attending?</legend>
              <div class="option-grid">
                <label for="attendanceAccept">
                  <input id="attendanceAccept" type="radio" name="attendance" value="accept" required />
                  <span>Joyfully accept</span>
                </label>
                <label for="attendanceDecline">
                  <input id="attendanceDecline" type="radio" name="attendance" value="decline" />
                  <span>Regretfully decline</span>
                </label>
              </div>
            </fieldset>

            <fieldset>
              <legend>Will you bring a plus one?</legend>
              <div class="option-grid">
                <label for="plusOneYes">
                  <input id="plusOneYes" type="radio" name="plusOne" value="yes" required />
                  <span>Yes</span>
                </label>
                <label for="plusOneNo">
                  <input id="plusOneNo" type="radio" name="plusOne" value="no" />
                  <span>No</span>
                </label>
              </div>
            </fieldset>

            <label id="plusOneDetails" hidden>
              <span>Plus-one name</span>
              <input name="plusOneName" autocomplete="name" placeholder="Their first and last name" />
            </label>

            <label>
              <span>Dietary restrictions</span>
              <textarea name="dietaryRestrictions" rows="3" placeholder="Allergies, restrictions, or meal notes"></textarea>
            </label>

            <label>
              <span>A note for the couple</span>
              <textarea name="note" rows="4" placeholder="Share a wish, a memory, or a song request..."></textarea>
            </label>

            <button class="send-button" type="submit">Send reply</button>
            <p class="form-message" id="formMessage" role="status"></p>
          </form>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
