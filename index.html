<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ahmed &amp; Christine RSVP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <main class="page-shell">
      <section class="invite-stage" aria-label="Engagement invitation">
        <div class="reveal-scene" id="revealScene" data-state="closed">
          <div class="stage-glow" aria-hidden="true"></div>

          <!-- LAYER 1 (back): sealed envelope. Visible at start. -->
          <img
            src="/envelope-closed.png"
            alt=""
            class="layer layer-closed"
            aria-hidden="true"
            draggable="false"
          />

          <!-- LAYER 2 (back, intermediate): envelope with flap just barely lifted. -->
          <img
            src="/envelope-slightly-open.png"
            alt=""
            class="layer layer-slightly-open"
            aria-hidden="true"
            draggable="false"
          />

          <!-- LAYER 3 (back, final state): envelope wide open with pocket visible. -->
          <img
            src="/envelope-open.png"
            alt=""
            class="layer layer-open"
            aria-hidden="true"
            draggable="false"
          />

          <!-- LAYER 4 (middle): the invitation card. Slides up from behind. -->
          <div class="card-stage" aria-hidden="true">
            <img
              src="/invitation_7pm.png"
              alt="The engagement invitation for Ahmed and Christine"
              class="invitation-card"
              draggable="false"
            />
          </div>

          <!-- LAYER 5 (front mask): the pocket. Hides bottom of card so it looks tucked in. -->
          <img
            src="/front-layer.png"
            alt=""
            class="layer layer-front"
            aria-hidden="true"
            draggable="false"
          />

          <!-- Click target -->
          <button
            class="open-trigger"
            id="openInvite"
            type="button"
            aria-label="Open invitation"
          >
            <span class="trigger-hint">tap to open</span>
          </button>
        </div>

        <div class="scroll-cue" id="scrollCue" aria-hidden="true">
          RSVP below ↓
        </div>
      </section>

      <section class="rsvp-section" id="rsvp">
        <div class="rsvp-art">
          <div class="reply-by">Reply by July 15</div>

          <h2>RSVP</h2>

          <div class="divider">
            <span></span>
            <b>♥</b>
            <span></span>
          </div>

          <form id="rsvpForm">
            <label>
              <span>Your name</span>
              <input
                name="name"
                autocomplete="name"
                placeholder="First and last name"
                required
              />
            </label>

            <label>
              <span>Email</span>
              <input
                name="email"
                type="email"
                autocomplete="email"
                placeholder="So we can stay in touch"
                required
              />
            </label>

            <fieldset>
              <legend>Will you be attending?</legend>
              <div class="option-grid">
                <label for="attendanceAccept">
                  <input id="attendanceAccept" type="radio" name="attendance" value="accept" required />
                  <span>Joyfully accept</span>
                </label>
                <label for="attendanceDecline">
                  <input id="attendanceDecline" type="radio" name="attendance" value="decline" />
                  <span>Regretfully decline</span>
                </label>
              </div>
            </fieldset>

            <fieldset>
              <legend>Will you bring a plus one?</legend>
              <div class="option-grid">
                <label for="plusOneYes">
                  <input id="plusOneYes" type="radio" name="plusOne" value="yes" required />
                  <span>Yes</span>
                </label>
                <label for="plusOneNo">
                  <input id="plusOneNo" type="radio" name="plusOne" value="no" />
                  <span>No</span>
                </label>
              </div>
            </fieldset>

            <label id="plusOneDetails" hidden>
              <span>Plus-one name</span>
              <input name="plusOneName" autocomplete="name" placeholder="Their first and last name" />
            </label>

            <label>
              <span>Dietary restrictions</span>
              <textarea name="dietaryRestrictions" rows="3" placeholder="Allergies, restrictions, or meal notes"></textarea>
            </label>

            <label>
              <span>A note for the couple</span>
              <textarea name="note" rows="4" placeholder="Share a wish, a memory, or a song request..."></textarea>
            </label>

            <button class="send-button" type="submit">Send reply</button>
            <p class="form-message" id="formMessage" role="status"></p>
          </form>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
